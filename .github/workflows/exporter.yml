name: Exporter mod

on:
  push:
    paths:
      - 'exporter/**'
      - '.github/workflows/exporter.yml'
  pull_request:
    paths:
      - 'exporter/**'
      - '.github/workflows/exporter.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exporter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vistaforge-exporter
          path: exporter/build/libs/*.jar
