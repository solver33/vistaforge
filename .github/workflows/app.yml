name: App

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

jobs:
  # The UI: types, unit tests, and browser tests against the mock backend.
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            app/playwright-report
            app/test-results

  # The Rust side of the app that doesn't need a webview. It also catches core changes that
  # break the app.
  bridge:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - name: Format
        run: cargo fmt -p vistaforge-bridge -p vistaforge-app --check
      - name: Clippy
        run: cargo clippy -p vistaforge-bridge --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test -p vistaforge-bridge --all-features

  # The Windows app and installer. Runs for app pull requests and for main.
  windows:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'claude/app')
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - run: npm ci
      - name: Build the UI
        run: npm run build
      - name: Clippy
        run: cargo clippy -p vistaforge-app -- -D warnings
      - name: Build the app
        run: npx tauri build
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/Vistaforge.exe out/Vistaforge.exe
          Copy-Item target/release/bundle/nsis/*-setup.exe out/
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: vistaforge-app-windows
          path: app/out/*
