[package]
name = "vistaforge-core"
version = "0.1.0"
edition = "2021"
description = "World generation core for Vistaforge: block catalog, Anvil (Minecraft 1.20.1) writer and generators."
publish = false

[lib]
name = "vistaforge_core"
path = "src/lib.rs"

[[bin]]
name = "vistaforge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
