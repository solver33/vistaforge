[package]
name = "vistaforge-bridge"
version = "0.1.0"
edition = "2021"
description = "What the Vistaforge app asks of the core: catalog, previews, export, settings files and paths. Has no Tauri dependency so it builds and tests anywhere."
publish = false

[features]
# A small HTTP server that serves the same commands to the UI in a browser (for development).
devserver = ["dep:tiny_http"]

[dependencies]
anyhow = "1"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = { version = "0.12", optional = true }
vistaforge-core = { path = "../../core" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[[bin]]
name = "vistaforge-devserver"
path = "src/bin/devserver.rs"
required-features = ["devserver"]
